name: CI

# develop 또는 main 브랜치로 PR이 열리거나 업데이트될 때 실행
on:
  pull_request:
    branches:
      - development
      - main
  merge_group:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.event.merge_group.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  HUSKY: 0
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  # ─────────────────────────────────────────
  # Job 1: 정적 품질 검사
  # ESLint, Prettier, TypeScript를 한 runner에서 실행해 설치 비용을 공유
  # ─────────────────────────────────────────
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: "npm"

      - name: Restore node_modules cache
        id: node-modules-cache
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-v2-${{ runner.os }}-node20-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Validate dependency tree
        if: steps.node-modules-cache.outputs.cache-hit == 'true'
        run: npm ls --all > /dev/null

      - name: Run ESLint
        run: npm run lint

      - name: Restore Prettier cache
        uses: actions/cache@v6
        with:
          path: .cache/prettier
          key: prettier-v2-${{ runner.os }}-node20-${{ hashFiles('package-lock.json', '.gitignore') }}-${{ github.sha }}
          restore-keys: |
            prettier-v2-${{ runner.os }}-node20-${{ hashFiles('package-lock.json', '.gitignore') }}-

      - name: Check formatting
        run: npx prettier --check . --cache --cache-location .cache/prettier --cache-strategy content

      - name: Generate Next.js route types
        run: |
          npx next typegen
          test -n "$(find .next/types -type f -print -quit)"

      - name: Restore TypeScript cache
        uses: actions/cache@v6
        with:
          path: .cache/tsconfig.tsbuildinfo
          key: typescript-v2-${{ runner.os }}-node20-${{ hashFiles('package-lock.json', 'tsconfig.json') }}-${{ github.sha }}
          restore-keys: |
            typescript-v2-${{ runner.os }}-node20-${{ hashFiles('package-lock.json', 'tsconfig.json') }}-

      - name: Run type check
        run: npx tsc --noEmit --incremental --tsBuildInfoFile .cache/tsconfig.tsbuildinfo

  # ─────────────────────────────────────────
  # Job 2: 취약점 검사
  # PR에 새 패키지 추가 시 알려진 취약점 체크
  # ─────────────────────────────────────────
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Dependency review
        uses: actions/dependency-review-action@v5

  # ─────────────────────────────────────────
  # Job 3: Vitest 단위 테스트 실행
  # ─────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: "npm"

      - name: Restore node_modules cache
        id: node-modules-cache
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-v2-${{ runner.os }}-node20-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Validate dependency tree
        if: steps.node-modules-cache.outputs.cache-hit == 'true'
        run: npm ls --all > /dev/null

      # vitest run: watch 모드 없이 1회 실행 후 종료
      - name: Run tests
        run: npx vitest run

  # ─────────────────────────────────────────
  # Job 4: Supabase pgTAP SQL 테스트
  # 로컬 Supabase 스택을 띄워 마이그레이션 적용 후 supabase/tests/**를 실행
  # ─────────────────────────────────────────
  supabase-test:
    name: Supabase SQL Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1.6.0
        with:
          version: 2.109.1

      - name: Start local Supabase
        run: supabase db start

      - name: Run pgTAP tests
        run: supabase test db

  # ─────────────────────────────────────────
  # Job 5: Next.js 프로덕션 빌드 검증
  # 다른 검증과 독립적으로 병렬 실행
  # ─────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    environment: ${{ github.base_ref == 'main' && 'Production' || 'develope' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: "npm"

      - name: Restore node_modules cache
        id: node-modules-cache
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-v2-${{ runner.os }}-node20-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Validate dependency tree
        if: steps.node-modules-cache.outputs.cache-hit == 'true'
        run: npm ls --all > /dev/null

      # 빌드 시 필요한 환경변수 주입 (Secrets에서 가져옴)
      # PR이 develop → main이면 PROD, 그 외엔 DEVELOP 값 사용
      - name: Build
        run: npm run build
        env:
          SKIP_NEXT_TYPE_CHECK: "1"
          NEXT_PUBLIC_SUPABASE_URL: ${{ github.base_ref == 'main' && secrets.PROD_SUPABASE_URL || secrets.DEVELOP_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ github.base_ref == 'main' && secrets.PROD_SUPABASE_ANON_KEY || secrets.DEVELOP_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ github.base_ref == 'main' && secrets.PROD_SUPABASE_SERVICE_ROLE_KEY || secrets.DEVELOP_SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ github.base_ref == 'main' && secrets.PROD_APP_URL || secrets.DEVELOP_APP_URL }}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
